<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>About Us | Glambient Wedding Photography &amp; Videography Team</title>
  <meta name="description" content="Meet Hunter &amp; Joey, the creative duo behind Glambient. Wedding photographers and videographers based in Manchester, blending editorial storytelling with authentic documentary style.">
  <link rel="canonical" href="https://glambient.co.uk/about.html">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Glambient">
  <meta property="og:title" content="About Us | Glambient Wedding Photography &amp; Videography Team">
  <meta property="og:description" content="Meet Hunter &amp; Joey, the creative duo behind Glambient. Wedding photographers and videographers based in Manchester, blending editorial storytelling with authentic documentary style.">
  <meta property="og:url" content="https://glambient.co.uk/about.html">
  <meta property="og:image" content="https://glambient.co.uk/images/6-35.jpg">
  <meta property="og:image:alt" content="Glambient wedding photography and videography team">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="About Us | Glambient Wedding Photography &amp; Videography Team">
  <meta name="twitter:description" content="Meet Hunter &amp; Joey, the creative duo behind Glambient. Wedding photographers and videographers based in Manchester.">
  <meta name="twitter:image" content="https://glambient.co.uk/images/6-35.jpg">
  <link rel="icon" type="image/svg+xml" href="images/logo.svg">
  <link rel="stylesheet" href="nav.css">
  
  <style>
    @font-face {
      font-family: 'Hillstown Sans';
      src: url('fonts/Hillstown Sans Clean Demo.otf') format('opentype');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }

    :root {
      --accent: #fff064;
      --muted: #5b5f66;
    }

    .hero-header {
      background: #ffffff;
      overflow: hidden;
    }

    .hero-image-wrapper {
      display: flex;
      justify-content: center;
      padding: 0 20px 0;
      position: relative;
      z-index: 1;
    }

    .hero-image-wrapper img {
      width: 100%;
      max-width: 700px;
      height: auto;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }

    /* Wrapper that holds the image in a column */
    .image-with-labels {
      display: flex;
      flex-direction: column;
      align-items: center;
      width: 100%;
      max-width: 700px;
    }


    section {
      padding: 80px 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* About image section under hero image */
    .about-section {
      padding: 24px 20px 0;
      max-width: 700px;
      margin: 0 auto;
    }

    .about-section img {
      width: 100%;
      max-width: 520px;
      height: auto;
      display: block;
      margin: 0 auto;
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }

    @media (max-width: 600px) {
      .about-section {
        padding-top: 16px;
      }
    }
    
    @media (max-width: 768px) {
      .hero-header h1 { font-size: clamp(2rem, 11vw, 3.5rem); }
    }
    
    .cta {
      background: #080808;
      color: #fff;
      text-align: center;
      padding: 80px 20px;
      margin: 80px 20px 0;
    }
    
    .cta h2 {
      color: #fff;
      margin-bottom: 20px;
      text-transform: uppercase;
      letter-spacing: 0.08em;
    }
    
    .cta p {
      font-size: 1.1rem;
      margin-bottom: 30px;
      opacity: 0.8;
    }
    
    .cta-btn-white {
      display: inline-block;
      background: var(--accent);
      color: #080808;
      padding: 14px 40px;
      font-weight: 700;
      font-size: 12px;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      transition: background 0.2s ease;
    }
    
    .cta-btn-white:hover {
      background: #ffe838;
    }
    
    footer {
      background: #080808;
      color: #fff;
      text-align: center;
      padding: 50px 20px;
      margin-top: 80px;
    }
    
    footer p {
      margin: 10px 0;
      font-size: 0.9rem;
      opacity: 0.7;
    }
    
    footer a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }
  </style>
</head>
<body>
  <script src="assets/js/nav.js"></script>
  <div class="page-banner">
    <div class="banner-inner">
      <hr class="banner-rule">
      <h1>About</h1>
      <hr class="banner-rule">
      <p class="banner-sub">we always come as a pair </p>
    </div>
  </div>
  <main>
    <div class="hero-header">
      <div class="hero-image-wrapper">
        <div class="image-with-labels">
          <img src="images/IMG_8889.jpeg" alt="Portrait of the Glambient founders" loading="eager" decoding="async">
        </div>
      </div>
    </div>

    <section class="about-section">
      <img src="images/IMG_7763.jpeg" alt="Candid portrait of the Glambient founders" loading="lazy" decoding="async">
    </section>

    <section style="padding: 0;">
      <div class="cta">
        <h2>Wanna talk more?</h2>
        <a href="contact.html" class="cta-btn-white">Let's have a chat</a>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Glambient. All rights reserved.</p>
    <p><a href="https://instagram.com/glambient.visuals" target="_blank" rel="noopener noreferrer">📸 Follow us on Instagram</a></p>
  </footer>

  <script>
    (function(){
      const version = new Date().toISOString().slice(0,13).replace(/\D/g,'');
      document.querySelectorAll('a[href$=".html"]').forEach(a=>{
        try{
          const url = new URL(a.href, location.origin);
          if(url.origin === location.origin){
            url.searchParams.set('v', version);
            a.href = url.toString();
          }
        }catch(e){}
      });
    })();
  </script>
</body>
</html>
