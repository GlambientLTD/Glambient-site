  <style>
    body {
      background: #ffffff;
    }

    .gallery-grid {
      --cell-height: clamp(96px, 8vw, 132px);
      max-width: 1380px;
      margin: 0 auto;
      padding: 30px clamp(1rem, 4vw, 3rem) 120px;
      display: grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      grid-auto-rows: var(--cell-height);
      gap: clamp(10px, 1.4vw, 18px);
      grid-auto-flow: dense;
    }

    .gallery-item {
      margin: 0;
      overflow: hidden;
      background: #000;
      height: 100%;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      transform: scale(1);
      transform-origin: center;
      transition: transform 0.35s ease;
    }

    .gallery-item:is(:hover, :focus-within) img {
      transform: scale(1.04);
    }

    .gallery-item:nth-child(8n + 1) { grid-column: span 3; grid-row: span 4; }
    .gallery-item:nth-child(8n + 2) { grid-column: span 6; grid-row: span 4; }
    .gallery-item:nth-child(8n + 3) { grid-column: span 3; grid-row: span 4; }
    .gallery-item:nth-child(8n + 4) { grid-column: span 4; grid-row: span 5; }
    .gallery-item:nth-child(8n + 5) { grid-column: span 4; grid-row: span 5; }
    .gallery-item:nth-child(8n + 6) { grid-column: span 4; grid-row: span 5; }
    .gallery-item:nth-child(8n + 7) { grid-column: span 6; grid-row: span 4; }
    .gallery-item:nth-child(8n) { grid-column: span 6; grid-row: span 4; }

    @media (max-width: 1024px) {
      .gallery-grid {
        grid-template-columns: repeat(8, minmax(0, 1fr));
        --cell-height: clamp(90px, 9vw, 120px);
        padding-bottom: 90px;
      }

      .gallery-item:nth-child(8n + 1),
      .gallery-item:nth-child(8n + 3),
      .gallery-item:nth-child(8n + 4),
      .gallery-item:nth-child(8n + 5),
      .gallery-item:nth-child(8n + 6) {
        grid-column: span 4;
        grid-row: span 4;
      }

      .gallery-item:nth-child(8n + 2),
      .gallery-item:nth-child(8n + 7),
      .gallery-item:nth-child(8n) {
        grid-column: span 8;
        grid-row: span 4;
      }
    }

    @media (max-width: 680px) {
      .gallery-grid {
        display: flex;
        flex-direction: column;
        padding: 12px 16px 64px;
        gap: 10px;
      }

      .gallery-item,
      .gallery-item:nth-child(8n + 1),
      .gallery-item:nth-child(8n + 2),
      .gallery-item:nth-child(8n + 3),
      .gallery-item:nth-child(8n + 4),
      .gallery-item:nth-child(8n + 5),
      .gallery-item:nth-child(8n + 6),
      .gallery-item:nth-child(8n + 7),
      .gallery-item:nth-child(8n) {
        width: 100%;
        height: auto;
      }

      .gallery-item img {
        height: auto;
        object-fit: unset;
        transform: none;
      }

      .gallery-item:is(:hover, :focus-within) img {
        transform: none;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      .gallery-item img {
        transition: none;
      }

      .gallery-item:is(:hover, :focus-within) img {
        transform: scale(1);
      }
    }
  </style>

  <script>
  (function(){
    const version = new Date().toISOString().slice(0,13).replace(/\D/g,'');
    document.querySelectorAll('a[href$=".html"]').forEach(a=>{
      try{
        const url = new URL(a.href, location.origin);
        if(url.origin === location.origin){
          url.searchParams.set('v', version);
          a.href = url.toString();
        }
      }catch(e){}
    });
  })();
